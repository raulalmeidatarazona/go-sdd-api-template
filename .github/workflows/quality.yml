name: quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 3s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: SDD diff gate
        if: github.event_name == 'pull_request'
        run: go run ./tools/repoguard sdd --base ${{ github.event.pull_request.base.sha }}
      - name: Create isolated test database
        env:
          PGPASSWORD: app
        run: psql -h localhost -U app -d app -c 'CREATE DATABASE app_test'
      - name: Full gate
        env:
          DATABASE_URL: postgres://app:app@localhost:5432/app?sslmode=disable
          TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test?sslmode=disable
        run: make check
